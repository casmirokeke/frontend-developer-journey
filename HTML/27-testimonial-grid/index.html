<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Testimonials | Casmir Codes</title>
</head>

<body>

    <header>
        <h1>What Our Customers Say</h1>
        <p>
            Honest feedback from people who have experienced our services.
        </p>

        <nav aria-label="Main navigation">
            <a href="#testimonials">Testimonials</a> |
            <a href="#reviews">Reviews</a> |
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <main>

        <section id="testimonials" aria-labelledby="testimonials-heading">

            <h2 id="testimonials-heading">Customer Testimonials</h2>

            <!-- Testimonial 1 -->
            <figure>
                <blockquote>
                    <p>
                        "Casmir Codes helped us create a professional website
                        that made our business look more credible online."
                    </p>
                </blockquote>

                <figcaption>
                    — <strong>Daniel Okafor</strong>,
                    Business Owner
                </figcaption>
            </figure>

            <hr>

            <!-- Testimonial 2 -->
            <figure>
                <blockquote>
                    <p>
                        "The website was responsive, easy to navigate, and
                        exactly what we needed for our customers."
                    </p>
                </blockquote>

                <figcaption>
                    — <strong>Sarah Williams</strong>,
                    Entrepreneur
                </figcaption>
            </figure>

            <hr>

            <!-- Testimonial 3 -->
            <figure>
                <blockquote>
                    <p>
                        "I was impressed by the attention to detail and the
                        clean structure of the entire website."
                    </p>
                </blockquote>

                <figcaption>
                    — <strong>Michael Johnson</strong>,
                    Startup Founder
                </figcaption>
            </figure>

        </section>

        <!-- Review Section -->
        <section id="reviews" aria-labelledby="reviews-heading">

            <h2 id="reviews-heading">More Reviews</h2>

            <figure>
                <blockquote cite="https://example.com/reviews">
                    <p>
                        "A smooth experience from the beginning to the final
                        delivery. I would definitely recommend the service."
                    </p>
                </blockquote>

                <figcaption>
                    — <strong>Grace Eze</strong>,
                    Product Manager
                </figcaption>
            </figure>

            <figure>
                <blockquote>
                    <p>
                        "The communication was clear, the process was simple,
                        and the final result exceeded my expectations."
                    </p>
                </blockquote>

                <figcaption>
                    — <strong>Chris Adeyemi</strong>,
                    Content Creator
                </figcaption>
            </figure>

        </section>

        <!-- Rating Summary -->
        <section aria-labelledby="rating-heading">

            <h2 id="rating-heading">Customer Rating</h2>

            <p>
                Average rating:
                <strong>4.8 out of 5</strong>
            </p>

            <meter
                min="0"
                max="5"
                value="4.8">
                4.8 out of 5
            </meter>

        </section>

        <!-- Contact -->
        <section id="contact" aria-labelledby="contact-heading">

            <h2 id="contact-heading">Share Your Experience</h2>

            <form action="#" method="post">

                <div>
                    <label for="name">Your Name:</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        autocomplete="name"
                        required
                    >
                </div>

                <br>

                <div>
                    <label for="review">Your Review:</label>
                    <br>
                    <textarea
                        id="review"
                        name="review"
                        rows="6"
                        cols="40"
                        required
                    ></textarea>
                </div>

                <br>

                <div>
                    <label for="rating">Rating:</label>

                    <select id="rating" name="rating" required>
                        <option value="">Choose a rating</option>
                        <option value="5">5 - Excellent</option>
                        <option value="4">4 - Very Good</option>
                        <option value="3">3 - Good</option>
                        <option value="2">2 - Fair</option>
                        <option value="1">1 - Poor</option>
                    </select>
                </div>

                <br>

                <button type="submit">
                    Submit Review
                </button>

            </form>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Casmir Codes. All rights reserved.</p>
    </footer>

</body>
</html>
